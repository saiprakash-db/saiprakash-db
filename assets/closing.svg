<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Data thought by Sai Prakash Lingala">
  <defs>
    <clipPath id="wave-clip">
      <rect x="5" y="290" width="990" height="70"/>
    </clipPath>
  </defs>

  <rect width="1000" height="420" fill="#0d1117"/>

  <text x="5" y="48" fill="#e6edf3"
        font-family="Arial, sans-serif" font-size="24" font-weight="600">
    Data Thought
  </text>
  <line x1="5" y1="68" x2="995" y2="68" stroke="#30363d"/>

  <rect x="5" y="88" width="990" height="150" rx="8"
        fill="#000000" stroke="#c9d1d9" stroke-width="1"/>

  <text x="32" y="147" fill="#ff9800"
        font-family="Arial, sans-serif" font-size="46" font-weight="700">“</text>
  <text x="80" y="147" fill="#67e8f9"
        font-family="Arial, sans-serif" font-size="30" font-style="italic">
    Data becomes valuable when analysis turns it
  </text>
  <text x="80" y="190" fill="#67e8f9"
        font-family="Arial, sans-serif" font-size="30" font-style="italic">
    into a decision someone can act on.
  </text>
  <text x="970" y="221" text-anchor="end" fill="#ff9800"
        font-family="Arial, sans-serif" font-size="17">
    — Sai Prakash Lingala
  </text>

  <line x1="5" y1="268" x2="995" y2="268" stroke="#30363d"/>

  <g clip-path="url(#wave-clip)">
    <path fill="#050608"
          d="M5 310 Q250 330 500 310 T995 310 V360 H5 Z">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="
          M5 310 Q250 330 500 310 T995 310 V360 H5 Z;
          M5 310 Q250 290 500 310 T995 330 V360 H5 Z;
          M5 310 Q250 330 500 310 T995 310 V360 H5 Z"/>
    </path>
    <path fill="#000000"
          d="M5 328 Q250 312 500 328 T995 328 V360 H5 Z">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="
          M5 328 Q250 312 500 328 T995 328 V360 H5 Z;
          M5 328 Q250 344 500 328 T995 312 V360 H5 Z;
          M5 328 Q250 312 500 328 T995 328 V360 H5 Z"/>
    </path>
  </g>

  <text x="500" y="395" text-anchor="middle" fill="#c9d1d9"
        font-family="Arial, sans-serif" font-size="14">
    Sai Prakash Lingala · Turning data into decisions · SQL · Python · Power BI
  </text>
</svg>
