<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="A data thought by Sai Prakash Lingala">
  <rect width="960" height="300" fill="#0d1117"/>

  <text x="55" y="48" fill="#e6edf3"
        font-family="Arial, sans-serif" font-size="24" font-weight="600">
    ✍️ A Data Thought
  </text>
  <line x1="55" y1="67" x2="905" y2="67" stroke="#30363d"/>

  <rect x="85" y="92" width="790" height="142" rx="7"
        fill="#000000" stroke="#c9d1d9" stroke-width="1"/>

  <text x="115" y="137" fill="#ff9800"
        font-family="Arial, sans-serif" font-size="32" font-weight="700">“</text>
  <text x="151" y="137" fill="#67e8f9"
        font-family="Arial, sans-serif" font-size="21" font-style="italic">
    Data becomes valuable when analysis turns it
  </text>
  <text x="151" y="169" fill="#67e8f9"
        font-family="Arial, sans-serif" font-size="21" font-style="italic">
