<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-label="A data thought by Sai Prakash Lingala">
  <rect width="1000" height="390" fill="#0d1117"/>

  <text x="60" y="48" fill="#e6edf3"
        font-family="Arial, sans-serif" font-size="24" font-weight="600">
    A Data Thought
  </text>
  <line x1="60" y1="68" x2="940" y2="68" stroke="#30363d"/>

  <rect x="80" y="88" width="840" height="142" rx="8"
        fill="#000000" stroke="#c9d1d9" stroke-width="1"/>

  <text x="108" y="134" fill="#ff9800"
        font-family="Arial, sans-serif" font-size="32" font-weight="700">“</text>
  <text x="146" y="132" fill="#67e8f9"
        font-family="Arial, sans-serif" font-size="21" font-style="italic">
    Data becomes valuable when analysis turns it
  </text>
  <text x="146" y="164" fill="#67e8f9"
        font-family="Arial, sans-serif" font-size="21" font-style="italic">
    into a decision someone can act on.
  </text>
  <text x="890" y="207" text-anchor="end" fill="#ff9800"
        font-family="Arial, sans-serif" font-size="16">
    — Sai Prakash Lingala
  </text>

  <line x1="60" y1="254" x2="940" y2="254" stroke="#30363d"/>

  <path fill="#050608"
        d="M60 296 Q260 314 460 298 T860 294 T940 298 V342 H60 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="
        M60 296 Q260 314 460 298 T860 294 T940 298 V342 H60 Z;
        M60 300 Q260 282 460 302 T860 310 T940 300 V342 H60 Z;
        M60 296 Q260 314 460 298 T860 294 T940 298 V342 H60 Z"/>
  </path>
  <path fill="#000000"
        d="M60 310 Q260 298 460 312 T860 306 T940 310 V342 H60 Z">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="
        M60 310 Q260 298 460 312 T860 306 T940 310 V342 H60 Z;
        M60 306 Q260 320 460 304 T860 314 T940 306 V342 H60 Z;
        M60 310 Q260 298 460 312 T860 306 T940 310 V342 H60 Z"/>
  </path>

  <text x="500" y="374" text-anchor="middle" fill="#c9d1d9"
        font-family="Arial, sans-serif" font-size="14">
    Sai Prakash Lingala · Turning data into decisions
  </text>
</svg>
