  </text>

  <text x="835" y="207" text-anchor="end" fill="#ff9800"
        font-family="Arial, sans-serif" font-size="16">
    — Sai Prakash Lingala
  </text>

  <line x1="55" y1="260" x2="905" y2="260" stroke="#30363d"/>
  <text x="480" y="287" text-anchor="middle" fill="#c9d1d9"
        font-family="Arial, sans-serif" font-size="14">
    Turning data into decisions · SQL · Python · Power BI
  </text>
</svg>
